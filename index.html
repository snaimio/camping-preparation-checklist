<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <title>Camp Prepper!</title>
</head>
<body>
  
  <div id="grid">
  <main>
    <div id="counter">
      <h1 id="counterText">0 of 8 items ready!</h1>
    </div>
    <div id="controls">
      <img src="assets/images/pic1.png" alt="camping item 1" class="thumb" id="0">
      <img src="assets/images/pic2.png" alt="camping item 2" class="thumb" id="1">
      <img src="assets/images/pic3.png" alt="camping item 3" class="thumb" id="2">
      <img src="assets/images/pic4.png" alt="camping item 4" class="thumb" id="3">
      <img src="assets/images/pic5.png" alt="camping item 5" class="thumb" id="4">
      <img src="assets/images/pic6.png" alt="camping item 6" class="thumb" id="5">
      <img src="assets/images/pic7.png" alt="camping item 7" class="thumb" id="6">
      <img src="assets/images/pic8.png" alt="camping item 8" class="thumb" id="7">
    </div>
    <div id="reset">
      <input id="goCampingBtn" type="button" value="Reset" onclick="ResetPrep();">
    </div>
  </main>
  </div>

  <script src="js/jquery.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
